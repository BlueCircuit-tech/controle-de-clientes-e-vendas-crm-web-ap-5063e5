<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ávera Unicuidado</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marca: {
              DEFAULT: '#6F760A',
              dark: '#4F5504',
              mid: '#8D8602',
              light: '#C4BC00',
              amber: '#A67B01',
              50: '#F4F5EC',
              100: '#E8EAD0',
              200: '#D1D6A1',
              300: '#B8C072',
              700: '#4F5504',
              800: '#3D4203',
              900: '#2B2E02',
            }
          },
          fontFamily: {
            sans: ['"DM Sans"', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html, body { overscroll-behavior: none; }
    body { font-family: 'DM Sans', system-ui, sans-serif; }

    .nav-item { position: relative; transition: color 0.2s ease; }
    .nav-item::before {
      content: '';
      position: absolute;
      top: -2px;
      left: 50%;
      transform: translateX(-50%) scaleX(0);
      width: 32px;
      height: 3px;
      border-radius: 9999px;
      background: #C4BC00;
      transition: transform 0.25s ease;
    }
    .nav-item.ativo { color: #C4BC00; }
    .nav-item.ativo::before { transform: translateX(-50%) scaleX(1); }
    .nav-item:not(.ativo) { color: #6F760A; opacity: 0.5; }

    .nav-item svg { transition: transform 0.2s ease; }
    .nav-item.ativo svg { transform: translateY(-1px); }

    ::-webkit-scrollbar { width: 0; height: 0; }
  </style>
</head>
<body class="bg-neutral-100 flex items-center justify-center min-h-screen">

  <div id="app-frame" class="w-full max-w-[430px] h-screen max-h-[100dvh] bg-white sm:rounded-[2rem] sm:shadow-2xl sm:border sm:border-neutral-200 flex flex-col overflow-hidden relative">

    <!-- Header -->
    <header class="shrink-0 bg-marca-dark px-5 pt-4 pb-3 flex items-center justify-between z-20">
      <div>
        <h1 class="text-white font-bold text-lg leading-tight tracking-tight">Ávera Unicuidado</h1>
        <p class="text-marca-200 text-[11px] font-medium mt-0.5 tracking-wide uppercase">Painel Profissional</p>
      </div>
      <div class="flex items-center gap-3">
        <button class="relative p-1.5 rounded-full bg-white/10 text-white hover:bg-white/20 transition-colors" aria-label="Notificações">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="absolute -top-0.5 -right-0.5 w-4 h-4 bg-marca-light text-marca-dark text-[10px] font-bold rounded-full flex items-center justify-center">3</span>
        </button>
        <div class="w-8 h-8 rounded-full bg-marca-light flex items-center justify-center text-marca-dark font-bold text-sm">DR</div>
      </div>
    </header>

    <!-- Área de conteúdo das telas -->
    <main class="flex-1 overflow-y-auto bg-neutral-50 relative">
      <!-- TELAS -->
    </main>

    <!-- Navegação inferior -->
    <nav class="shrink-0 bg-white border-t border-neutral-200/80 pb-[env(safe-area-inset-bottom)] z-20">
      <div class="flex items-center justify-around px-1 pt-2 pb-1">
        <button data-nav="dashboard-profissional" onclick="mostrarTela('dashboard-profissional')" class="nav-item ativo flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl min-w-[56px]" aria-label="Dashboard Profissional">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span class="text-[10px] font-semibold leading-none">Dashboard</span>
        </button>
        <button data-nav="jornada-diaria" onclick="mostrarTela('jornada-diaria')" class="nav-item flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl min-w-[56px]" aria-label="Jornada Diária">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/></svg>
          <span class="text-[10px] font-semibold leading-none">Jornada</span>
        </button>
        <button data-nav="pre-anamnese-com-ia" onclick="mostrarTela('pre-anamnese-com-ia')" class="nav-item flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl min-w-[56px]" aria-label="Pré-Anamnese com IA">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          <span class="text-[10px] font-semibold leading-none">Anamnese IA</span>
        </button>
        <button data-nav="consulta-e-prontuario" onclick="mostrarTela('consulta-e-prontuario')" class="nav-item flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl min-w-[56px]" aria-label="Consulta e Prontuário">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          <span class="text-[10px] font-semibold leading-none">Prontuário</span>
        </button>
        <button data-nav="bancos-e-motor" onclick="mostrarTela('bancos-e-motor')" class="nav-item flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl min-w-[56px]" aria-label="Bancos e Motor">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>
          <span class="text-[10px] font-semibold leading-none">Bancos</span>
        </button>
      </div>
    </nav>
  </div>

  <script>
    function mostrarTela(id) {
      document.querySelectorAll('[data-tela]').forEach(function (s) {
        s.classList.toggle('hidden', s.dataset.tela !== id);
      });
      document.querySelectorAll('[data-nav]').forEach(function (b) {
        b.classList.toggle('ativo', b.dataset.nav === id);
      });
      window.scrollTo({ top: 0 });
    }
    document.addEventListener('DOMContentLoaded', function () {
      mostrarTela('dashboard-profissional');
    });
  </script>
</body>
</html>
